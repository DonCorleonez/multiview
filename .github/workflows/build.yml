name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional)
        env:
          MV_KEYSTORE_B64: ${{ secrets.MV_KEYSTORE_B64 }}
        run: |
          if [ -n "$MV_KEYSTORE_B64" ]; then
            echo "$MV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release signing key present"
          else
            echo "::warning::No MV_KEYSTORE_B64 secret: release APK is signed with a throwaway debug key (updates will need an uninstall)."
          fi

      - name: Test, lint, build, check
        env:
          MV_STORE_PASSWORD: ${{ secrets.MV_STORE_PASSWORD }}
        run: |
          set -o pipefail
          {
            set -e
            echo "== unit tests"; ./gradlew --no-daemon --console=plain testDebugUnitTest
            echo "== lint"; ./gradlew --no-daemon --console=plain lintDebug
            echo "== assemble"; ./gradlew --no-daemon --console=plain assembleDebug assembleRelease
            echo "== apk checks"; tools/check-apk.sh app/build/outputs/apk/release/app-release.apk
          } 2>&1 | tee build.log

      - name: Report failure log as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI failed (run ${GITHUB_RUN_NUMBER}). Last part of the log:"
            echo '```'
            grep -E "^(== |e: |w: |FAILURE|BUILD|\* What went wrong|> |Execution failed|.*Test > .*FAILED|.*Error|.*error:|CHECK FAILED)" build.log | tail -n 80 || true
            echo '--- tail ---'
            tail -n 120 build.log || true
            echo '```'
          } > comment.md
          for f in app/build/reports/lint-results-debug.txt; do [ -f "$f" ] && { echo; echo "lint:"; echo '```'; head -c 20000 "$f"; echo '```'; } >> comment.md; done
          head -c 60000 comment.md > c.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@c.md > /dev/null

      - name: Collect APKs
        run: |
          mkdir -p out
          V="1.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "out/multiview-$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/multiview-$V-debug.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${GITHUB_RUN_NUMBER}"
          gh release create "v$V" out/*.apk --title "Multiview $V" \
            --notes "Install: \`adb install -r multiview-$V.apk\`. The -debug APK logs player metrics for device tests (installs side by side)." \
            --target "$GITHUB_SHA"
